name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        # Use --no-lockfile to tolerate Emergent's Save-to-GitHub stripping yarn.lock.
        # yarn will resolve from package.json and produce a fresh lockfile in the CI workspace.
        run: |
          if [ -f yarn.lock ]; then
            echo "yarn.lock present — running full install"
            yarn install --network-timeout 600000
          else
            echo "yarn.lock absent — resolving from package.json directly"
            yarn install --no-lockfile --network-timeout 600000
          fi

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Restore Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          python3 -c "
          import base64, os, sys
          b64 = os.environ['KEYSTORE_B64'].strip()
          data = base64.b64decode(b64)
          with open('frontend/android/app/release-keystore.jks', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          if data[0] == 0x30:
              print('Format: PKCS12 (OK)')
          elif data[:4].hex() == 'feedfeed':
              print('Format: JKS (OK)')
          else:
              print(f'WARNING: unknown format {data[:4].hex()}')
              sys.exit(1)
          "

      - name: Configure Release Signing
        run: python3 scripts/patch-signing.py

      - name: Ensure google-services.json
        run: ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: CricApp v1.0.8
          body: |
            ## CricApp v1.0.8 — Phase 5 (Compact Scoreboard + Player Detail Modal)
            ### 🎯 Compact Scoreboard (Dynamic 20% Cap)
            - `scoreHeader` now has `maxHeight: SCREEN_H * 0.20` with `overflow: hidden` — scoreboard never exceeds 20% of screen regardless of device or display-zoom setting.
            - Team row redesigned: logo + (name / score / overs) in a horizontal block instead of vertical stack → saves ~30% vertical space.
            - Padding trimmed everywhere: `paddingTop 8 → 4`, `paddingBottom 6 → 2`, batsmen container `pV 5 → 3`, over summary container `pV 6 → 2`.
            - Fonts standardised: team score 18 → 15, team name 12 → 11, batsman name 11 → 10, labels 9-10 → 8.
            - Batsmen + Recent Overs are now single-line (title on left, data on right) instead of stacked blocks.
            - Result: ~80% of screen left for commentary, matching Cricbuzz/Cricket-Guru feel.
            ### 🎯 Player Detail Modal (tap-to-expand)
            - New `PlayerDetailModal.tsx` renders when any player row is tapped in the Squads tab (Playing XI / Substitutes / Bench).
            - Shows 130px circular photo with green border (Cricbuzz CDN).
            - Name + role + Captain / Wicket-Keeper / Substitute badges.
            - Bio box: Intl Team, Batting/Bowling style, Birthplace, DOB.
            - **Career stats grid**: Batting (Mat/Runs/Avg/SR) + Bowling (Mat/Wkts/Econ/SR) across all formats (Test/ODI/T20I/IPL etc.) fetched from `/stats/v1/player/{id}[/batting|/bowling]` with 2-minute cache.
            - Graceful fallback: if stats aren't available for a player, shows "Career stats not available."
            ### Phases 1-4 still in effect
            - Build Fix (compileSdk 36), rewarded ad ID fix, sync-on-open (tms+iid), Cricbuzz team-squad endpoint, smart ad unlock (2-fail fallthrough).
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
