name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Ensure google-services.json
        run: |
          if [ ! -f frontend/android/app/google-services.json ]; then
            echo "google-services.json missing after prebuild, restoring..."
          fi
          ls -la frontend/android/app/google-services.json

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease -x lint

      - name: Build Release AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease -x lint

      - name: Find build outputs
        id: find_outputs
        run: |
          APK_PATH=$(find frontend/android/app/build/outputs -name "*.apk" -type f | head -1)
          AAB_PATH=$(find frontend/android/app/build/outputs -name "*.aab" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"
          echo "AAB: $AAB_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: CricApp v1.0.4
          body: |
            ## CricApp v1.0.4 Release
            
            ### Changes:
            - Firebase Dynamic API Key integration (Firestore: app_config/settings)
            - Added 6 new API keys (Provider: free-cricbuzz-cricket-api)
            - Firebase-first priority with hardcoded key fallback
            - Total 25 API keys in rotation (19 original + 6 new)
            - Version upgrade: 3 -> 4
            
            ### Downloads:
            - **APK**: Direct install on Android device
            - **AAB**: For Google Play Store upload
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
