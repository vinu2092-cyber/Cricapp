name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        # Use --no-lockfile to tolerate Emergent's Save-to-GitHub stripping yarn.lock.
        # yarn will resolve from package.json and produce a fresh lockfile in the CI workspace.
        run: |
          if [ -f yarn.lock ]; then
            echo "yarn.lock present — running full install"
            yarn install --network-timeout 600000
          else
            echo "yarn.lock absent — resolving from package.json directly"
            yarn install --no-lockfile --network-timeout 600000
          fi

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Restore Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          python3 -c "
          import base64, os, sys
          b64 = os.environ['KEYSTORE_B64'].strip()
          data = base64.b64decode(b64)
          with open('frontend/android/app/release-keystore.jks', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          if data[0] == 0x30:
              print('Format: PKCS12 (OK)')
          elif data[:4].hex() == 'feedfeed':
              print('Format: JKS (OK)')
          else:
              print(f'WARNING: unknown format {data[:4].hex()}')
              sys.exit(1)
          "

      - name: Configure Release Signing
        run: python3 scripts/patch-signing.py

      - name: Ensure google-services.json
        run: ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: CricApp v1.0.8
          body: |
            ## CricApp v1.0.8 — Phase 3 (Deep Gap Recovery)
            ### 🔥 Commentary Pagination — The actual root cause
            - Cricbuzz mcenter/comm pagination requires **`tms` + `iid`** query params.
              The app was sending `timestamp` which the API ignored, so every "older"
              call returned the same latest ~25 balls — that's why users saw a 10-over gap
              after reopening the phone.
            - Now sends `tms=…&iid=…`; automatically walks back iid → iid-1 when an
              innings exhausts so we reach ball 0.1 of innings 1 regardless of which
              innings the user opened the match in.
            - Safety cap bumped 60 → 80 pages (~2000 balls, covers 50-over × 2 innings).
            - If the API returns no `iid`, falls back to iid=1 as a last-ditch attempt.
            ### Build Fix (Phase 1)
            - compileSdk bumped 35 → 36 so androidx.activity/core 1.11+/1.17+ build clean
            ### Rewarded Ads (Phase 2)
            - Corrected rewarded ad unit ID (was `/6702704058`, now `/6702740458` matching app.json / Play Store)
            - Removed blocking "Ad Not Available" alerts — on-demand errors now fall through silently so user still earns progress
            - Watch-ad button now shows a loading spinner and is disabled while the ad request is in flight (no more "dead" taps)
            - Reduced required rewarded ads 3 → 2 across all flows
            - Reward-grant fallback preserved: if an ad fails to load, progress still counts (feature unlock never blocks)
            ### Sync-on-Open robustness
            - `syncDoneRef` gate + AppState.active listener re-arms sync when the phone wakes
            - Progressive UI updates: user watches history fill in from top to bottom in real time
            ### Visual Event Cards (Cricket Guru parity)
            - 100% width event cards with marginVertical: 12 gap — no more squeezed look
            - Standardized fonts 13–14px across commentary rows, stats blocks, and event cards
            - Photos: OUT (soft red) / NEW BATSMAN (pastel green) / BOWLING CHANGE (light blue)
            ### Team Logos
            - Cricbuzz team logo now rendered on the match header AND every match list card (uses `imageId`/`teamId` from API)
            ### Scorecard
            - Batter/bowler avatars bumped 24 → 32px for visibility, matched Cricbuzz CDN URL template
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
