name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        # Use --no-lockfile to tolerate Emergent's Save-to-GitHub stripping yarn.lock.
        # yarn will resolve from package.json and produce a fresh lockfile in the CI workspace.
        run: |
          if [ -f yarn.lock ]; then
            echo "yarn.lock present — running full install"
            yarn install --network-timeout 600000
          else
            echo "yarn.lock absent — resolving from package.json directly"
            yarn install --no-lockfile --network-timeout 600000
          fi

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Restore Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          python3 -c "
          import base64, os, sys
          b64 = os.environ['KEYSTORE_B64'].strip()
          data = base64.b64decode(b64)
          with open('frontend/android/app/release-keystore.jks', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          if data[0] == 0x30:
              print('Format: PKCS12 (OK)')
          elif data[:4].hex() == 'feedfeed':
              print('Format: JKS (OK)')
          else:
              print(f'WARNING: unknown format {data[:4].hex()}')
              sys.exit(1)
          "

      - name: Configure Release Signing
        run: python3 scripts/patch-signing.py

      - name: Ensure google-services.json
        run: ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: CricApp v1.0.8
          body: |
            ## CricApp v1.0.8 — Phase 6 (UI polish: scoreboard, colors, logo fire-tail, inbox)
            ### Scoreboard Compaction
            - Removed the "Overlay OFF" toggle button from below the scoreboard; overlay is controlled by the pin icon in the header actions row now (no duplicate UI).
            - Match status line (e.g. "Gujarat Titans won by 5 wkts") moved **into** the center column of the team row, directly under the COMPLETED/LIVE badge — no extra vertical space used.
            - LAST BATSMEN + RECENT OVERS rows remain single-line (title on left, data on right).
            - Result: scoreboard takes even less space than Phase 5; commentary has more room.
            ### Softer Premium Colors (60% solid / 40% transparent)
            - Commentary container: `rgba(255,255,255,0.60)` (was 0.70)
            - Event cards: OUT, NEW BATSMAN, BOWLING CHANGE — all converted from solid hex to `rgba(..., 0.60)` with matching borderColor alpha. Less harsh on the eye.
            - SquadsSection + ScorecardSection row alternating colors: green/red/yellow all bumped 0.70 → 0.60.
            ### Logo Fire-Tail Animation 🔥
            - Removed the rainbow edge-border (`AnimatedGlowBorder`) that surrounded the whole app.
            - New `LogoFireTail` component wraps the header logo: six rainbow dots (red → orange → yellow → green → blue → purple) orbit the logo clockwise. Leading dot is solid, trailing dots fade to 25% opacity — looks like a tiny fire-tail.
            - **30 seconds per full revolution** exactly (user-requested cadence). Native-driver `Animated.timing` — zero perf impact.
            ### Admin Messages (Inbox)
            - Unread messages → light green bg (`rgba(200,230,201,0.60)`) with green left-border.
            - Read messages → white bg (`rgba(255,255,255,0.60)`).
            - Removed the 3-row rotating color palette that was overriding the read/unread state.
            - **Bug fix**: Tapping a message now opens a full-screen detail modal with scrollable body + close/OK button. Previously `onPress` only called `markAsRead` but never navigated anywhere — the user couldn't read long messages.
            ### Phases 1-5 still in effect
            - compileSdk 36, Cricbuzz tms+iid pagination, fetchTeamSquad, smart ad unlock fallthrough, Player Detail Modal, 20% scoreboard cap, team logos.
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
