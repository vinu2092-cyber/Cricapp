name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      # CRITICAL: Restore the release signing keystore from GitHub Secrets
      # This ensures the SHA1 always matches Play Store
      - name: Setup Release Signing Key
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > frontend/android/app/cricapp-upload.keystore
            echo "Release keystore restored from GitHub Secret"
            keytool -list -v -keystore frontend/android/app/cricapp-upload.keystore \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -alias "${{ secrets.KEY_ALIAS }}" 2>/dev/null | grep "SHA1" || true
          else
            echo "WARNING: RELEASE_KEYSTORE_B64 secret not set, using debug keystore"
          fi

      # Patch build.gradle to use the release keystore
      - name: Configure Release Signing
        run: |
          BUILD_GRADLE="frontend/android/app/build.gradle"
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            # Replace the signingConfigs block to add release config
            python3 << 'SCRIPT'
          import re
          with open("frontend/android/app/build.gradle", "r") as f:
              content = f.read()

          # Add release signing config
          new_signing = '''    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
              release {
                  storeFile file('cricapp-upload.keystore')
                  storePassword System.getenv("KEYSTORE_PASSWORD") ?: "cricapp2092secure"
                  keyAlias System.getenv("KEY_ALIAS") ?: "cricapp-upload-key"
                  keyPassword System.getenv("KEY_PASSWORD") ?: "cricapp2092secure"
              }
          }'''

          content = re.sub(
              r'signingConfigs\s*\{[^}]*debug\s*\{[^}]*\}[^}]*\}',
              new_signing,
              content,
              flags=re.DOTALL
          )

          # Update release buildType to use release signingConfig
          content = content.replace(
              'signingConfig signingConfigs.debug',
              'signingConfig signingConfigs.release'
          )

          with open("frontend/android/app/build.gradle", "w") as f:
              f.write(content)
          print("build.gradle patched with release signing config")
          SCRIPT
          else
            echo "No release keystore, keeping debug signing"
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Ensure google-services.json
        run: |
          if [ ! -f frontend/android/app/google-services.json ]; then
            echo "google-services.json missing after prebuild, restoring..."
          fi
          ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease -x lint --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease -x lint --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Find build outputs
        id: find_outputs
        run: |
          APK_PATH=$(find frontend/android/app/build/outputs -name "*.apk" -type f | head -1)
          AAB_PATH=$(find frontend/android/app/build/outputs -name "*.aab" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"
          echo "AAB: $AAB_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: CricApp v1.0.4
          body: |
            ## CricApp v1.0.4 Release
            
            ### Changes:
            - Firebase Dynamic API Key with Provider Factory Pattern
            - Scorecard page (Batting, Bowling, Fall of Wickets, Partnerships)
            - FCM Push Notifications with Deep Linking
            - Admin Inbox with broadcast messages
            - Banner Ad sizing fix
            - API key cleanup (removed dead keys)
            - Proper release signing setup
            
            ### Downloads:
            - **APK**: Direct install on Android device
            - **AAB**: For Google Play Store upload
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
