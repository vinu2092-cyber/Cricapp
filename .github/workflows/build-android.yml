name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        # Use --no-lockfile to tolerate Emergent's Save-to-GitHub stripping yarn.lock.
        # yarn will resolve from package.json and produce a fresh lockfile in the CI workspace.
        run: |
          if [ -f yarn.lock ]; then
            echo "yarn.lock present — running full install"
            yarn install --network-timeout 600000
          else
            echo "yarn.lock absent — resolving from package.json directly"
            yarn install --no-lockfile --network-timeout 600000
          fi

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Restore Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          python3 -c "
          import base64, os, sys
          b64 = os.environ['KEYSTORE_B64'].strip()
          data = base64.b64decode(b64)
          with open('frontend/android/app/release-keystore.jks', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          if data[0] == 0x30:
              print('Format: PKCS12 (OK)')
          elif data[:4].hex() == 'feedfeed':
              print('Format: JKS (OK)')
          else:
              print(f'WARNING: unknown format {data[:4].hex()}')
              sys.exit(1)
          "

      - name: Configure Release Signing
        run: python3 scripts/patch-signing.py

      - name: Ensure google-services.json
        run: ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          mkdir -p gradle/wrapper
          # ----- gradle-wrapper.jar -----
          # Expo prebuild does NOT ship gradle-wrapper.jar inside the generated
          # android/ folder, so the wrapper cannot even start. Build #86 relied
          # on `gradle wrapper --gradle-version 8.14.3` to regenerate it, but
          # that task's URL-validation step intermittently fails on GitHub
          # runners (PR #86 failure). We download the JAR directly from the
          # Gradle project's own source tree at tag v8.14.3 — a stable URL on
          # raw.githubusercontent.com. The wrapper JAR is small (~43 KB) and
          # is the same binary Gradle itself ships.
          JAR_URL="https://github.com/gradle/gradle/raw/v8.14.3/gradle/wrapper/gradle-wrapper.jar"
          echo "Downloading gradle-wrapper.jar from $JAR_URL"
          for i in 1 2 3; do
            if curl -fL --retry 3 --connect-timeout 30 --max-time 120 \
                 -o gradle/wrapper/gradle-wrapper.jar "$JAR_URL"; then
              echo "wrapper.jar downloaded on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying…"
            sleep 3
          done
          test -s gradle/wrapper/gradle-wrapper.jar || { echo "wrapper.jar download failed"; exit 1; }
          # ----- gradle-wrapper.properties -----
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          networkTimeout=30000
          validateDistributionUrl=false
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          chmod +x gradlew
          echo "--- wrapper files ---"
          ls -la gradle/wrapper/
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties
          # Pre-warm: forces the wrapper to fetch Gradle 8.14.3 once so
          # subsequent build steps don't race on the download.
          ./gradlew --no-daemon -q --version

      - name: Build Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: CricApp v1.0.10
          body: |
            ## CricApp v1.0.10 — Ads Unfreeze Critical Fix
            v1.0.9 shipped but App Open Ad, Interstitial Ad, and Rewarded Ad were NOT triggering on any user's device — complete zero-impression outage. RCA confirmed the `mobileAds().initialize()` promise was never resolving (likely a stuck mediation adapter) which left `isAdMobInitialized = false` forever and prevented all ad load/show calls from running.

            ### Fixes
            - **Init timeout (10 s)** around `mobileAds().initialize()` in `src/context/AdMobContext.native.tsx`. If the call doesn't resolve in time we set `sdkInitialized = true` anyway and proceed to load ads — the GMA SDK works fine without mediation, and a stuck adapter can no longer freeze every full-screen ad.
            - **UMP consent timeout (8 s)** around `AdsConsent.requestInfoUpdate()` and **consent form timeout (12 s)** around `loadAndShowConsentFormIfRequired()`. Consent flow cannot block the ad SDK init any more.
            - **Invalid fallback removed** — the old `AdsConsent.requestInfoUpdate(['pub-9675798593675825'])` call passed a string array where the v14.x API expects a `RequestInfoUpdateOptions` object; it was silently rejecting. Replaced with a clean timeboxed call.
            - **`com.google.android.gms.permission.AD_ID` permission** added to `app.json` → android.permissions. Required for Android 13+ (targetSdk 36) to access the advertising ID; without it personalised ads are blocked on newer devices.
            - **Unity Services ProGuard keep rules** added: `-keep class com.unity3d.services.** { *; }` + `-dontwarn com.unity3d.services.**`. Defensive — if minification ever gets enabled, Unity Ads SDK won't be stripped mid-init.

            ### Version
            - `app.json` version 1.0.9 → **1.0.10**, versionCode 9 → **10**.

            ### Preserved from v1.0.9
            - Unity Ads mediation (`plugins/withUnityAdsMediation.js`)
            - Rewarded Ad Unit ID `/6702704058` (verified from AdMob "UnlockProAd")
            - Rewarded fire-and-forget bug fix (10-fail threshold)
            - Scoreboard 30 % cap, Header logo ~18 % larger, LogoFireTail rainbow pixel line

            ### Files changed
            - `frontend/src/context/AdMobContext.native.tsx`
            - `frontend/app.json`
            - `.github/workflows/build-android.yml`
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
