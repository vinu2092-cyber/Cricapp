name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        # Use --no-lockfile to tolerate Emergent's Save-to-GitHub stripping yarn.lock.
        # yarn will resolve from package.json and produce a fresh lockfile in the CI workspace.
        run: |
          if [ -f yarn.lock ]; then
            echo "yarn.lock present — running full install"
            yarn install --network-timeout 600000
          else
            echo "yarn.lock absent — resolving from package.json directly"
            yarn install --no-lockfile --network-timeout 600000
          fi

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Restore Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          python3 -c "
          import base64, os, sys
          b64 = os.environ['KEYSTORE_B64'].strip()
          data = base64.b64decode(b64)
          with open('frontend/android/app/release-keystore.jks', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          if data[0] == 0x30:
              print('Format: PKCS12 (OK)')
          elif data[:4].hex() == 'feedfeed':
              print('Format: JKS (OK)')
          else:
              print(f'WARNING: unknown format {data[:4].hex()}')
              sys.exit(1)
          "

      - name: Configure Release Signing
        run: python3 scripts/patch-signing.py

      - name: Ensure google-services.json
        run: ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: CricApp v1.0.8
          body: |
            ## CricApp v1.0.8 — Final Phase
            ### IPL + Squads
            - Fixed IPL/BBL/PSL/CPL/SA20/etc. tab population (per-series categorization)
            - Squads: Playing XI / Substitutes / Bench sections with Cricbuzz profile photos end-to-end
            ### Commentary
            - Sync-on-Open: every app launch fetches full history back to ball 0.1 (≤1500 balls)
            - Fast-exit when stored history already has opening ball (saves API calls)
            - Fixed pagination fallback bug that looped on latest balls
            - Commentary rows: 2 soft pastel colors (yellow + green); red reserved for OUT cards only
            - Full-width layout (removed inner padding — container uses whole screen)
            ### Event Cards (Cricbuzz-style)
            - OUT card: soft red, batter photo + runs/balls + SR + dismissal
            - NEW BATSMAN card: pastel green, incoming player photo
            - BOWLING CHANGE card: light blue, bowler photo
            ### Scorecard
            - Batters and bowlers now show avatar photos next to names (Cricket Guru parity)
            ### Appearance
            - Settings → Change Background: 4 standard presets (Classic / White / Black / Light Green) + Custom photo upload via gallery
            - Wallpaper persists across app restarts (AsyncStorage)
            ### Pro Unlock
            - Reduced required rewarded ads from 3 → 2
            - Reward-grant fallback: if an ad fails to load the progress still counts (feature unlock never blocked)
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
