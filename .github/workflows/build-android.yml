name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install

      # CRITICAL: Backup the original signing keystore BEFORE expo prebuild
      - name: Backup Original Keystore
        run: |
          if [ -f frontend/android/app/debug.keystore ]; then
            cp frontend/android/app/debug.keystore /tmp/original-debug.keystore
            echo "Original keystore backed up ($(md5sum frontend/android/app/debug.keystore | cut -d' ' -f1))"
          else
            echo "No existing keystore found, will restore from repo after prebuild"
          fi

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      # CRITICAL: Restore the original keystore AFTER expo prebuild
      # This ensures the SHA1 matches the one used for v1.0.3 on Play Store
      - name: Restore Original Keystore
        run: |
          if [ -f /tmp/original-debug.keystore ]; then
            cp /tmp/original-debug.keystore frontend/android/app/debug.keystore
            echo "Original keystore restored ($(md5sum frontend/android/app/debug.keystore | cut -d' ' -f1))"
          fi
          ls -la frontend/android/app/debug.keystore

      # Ensure signing config in build.gradle uses the debug.keystore for release
      - name: Patch Signing Config
        run: |
          BUILD_GRADLE="frontend/android/app/build.gradle"
          if ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
            echo "WARNING: No signingConfigs found in build.gradle"
          fi
          # Verify release build uses debug signing config
          if grep -q 'signingConfig signingConfigs.debug' "$BUILD_GRADLE"; then
            echo "Release signing config OK: uses debug.keystore"
          else
            echo "WARNING: Release signing config may not use debug.keystore"
          fi
          # Show the keystore SHA1 for verification
          keytool -list -v -keystore frontend/android/app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA1\|SHA256" || echo "keytool SHA info not available"

      - name: Ensure google-services.json
        run: |
          if [ ! -f frontend/android/app/google-services.json ]; then
            echo "google-services.json missing after prebuild, restoring..."
          fi
          ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease -x lint --no-daemon

      - name: Find build outputs
        id: find_outputs
        run: |
          APK_PATH=$(find frontend/android/app/build/outputs -name "*.apk" -type f | head -1)
          AAB_PATH=$(find frontend/android/app/build/outputs -name "*.aab" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"
          echo "AAB: $AAB_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: CricApp v1.0.4
          body: |
            ## CricApp v1.0.4 Release
            
            ### Changes:
            - Firebase Dynamic API Key with Provider Factory Pattern
            - Scorecard page (Batting, Bowling, Fall of Wickets, Partnerships)
            - FCM Push Notifications with Deep Linking
            - Admin Inbox with broadcast messages
            - Banner Ad sizing fix
            - API key cleanup (removed dead keys)
            
            ### Downloads:
            - **APK**: Direct install on Android device
            - **AAB**: For Google Play Store upload
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
