name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        # Use --no-lockfile to tolerate Emergent's Save-to-GitHub stripping yarn.lock.
        # yarn will resolve from package.json and produce a fresh lockfile in the CI workspace.
        run: |
          if [ -f yarn.lock ]; then
            echo "yarn.lock present — running full install"
            yarn install --network-timeout 600000
          else
            echo "yarn.lock absent — resolving from package.json directly"
            yarn install --no-lockfile --network-timeout 600000
          fi

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Restore Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          python3 -c "
          import base64, os, sys
          b64 = os.environ['KEYSTORE_B64'].strip()
          data = base64.b64decode(b64)
          with open('frontend/android/app/release-keystore.jks', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          if data[0] == 0x30:
              print('Format: PKCS12 (OK)')
          elif data[:4].hex() == 'feedfeed':
              print('Format: JKS (OK)')
          else:
              print(f'WARNING: unknown format {data[:4].hex()}')
              sys.exit(1)
          "

      - name: Configure Release Signing
        run: python3 scripts/patch-signing.py

      - name: Ensure google-services.json
        run: ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: CricApp v1.0.9
          body: |
            ## CricApp v1.0.9 — Ad Revenue Restore (Unity Ads mediation + rewarded-ad bug fix)
            AdMob Ads Activity dashboard showed revenue dropped to near-zero on 16–17 Apr 2026 after v1.0.7 shipped. Targeted restore of the SINGLE thing that was silently removed in v1.0.7 + fixed the rewarded-ad fire-and-forget bug.

            ### Unity Ads mediation restored (primary fix)
            - `frontend/plugins/withUnityAdsMediation.js` restored + plugin re-registered in `app.json`. AdMob Console has Unity Ads configured as a bidding source; without the SDK in the APK every Unity-routed impression was lost. ProGuard rules for `com.unity3d.ads.**` and `com.google.ads.mediation.unity.**` restored in `app.json` → `extraProguardRules`.

            ### Rewarded-ad fire-and-forget bug fix
            - `handleWatchAd` in `app/match/[id].tsx` no longer fire-and-forgets the ad — it **awaits** `showRewardedAd()` and only increments the watched counter on a real `EARNED_REWARD` event. Same fix on the home-screen watch-ad button in `app/index.tsx`.
            - 10-failure threshold before a no-fill fallback credit is given (not a full Pro auto-unlock).

            ### Rewarded Ad Unit ID corrected
            - Real unit ID (verified from AdMob console screenshot of "UnlockProAd"): `ca-app-pub-9675798593675825/6702704058`. A previous auto-commit had mistakenly changed it to `6702740458` — that unit does not exist on the AdMob account, which is why rewarded ads stopped loading. Restored to the correct value in both `app.json` and `AdMobContext.native.tsx`.

            ### UI Polish (same release)
            - **Scoreboard max height** increased from 20 % → **30 %** of screen (`app/match/[id].tsx`). Added a 16 % minimum so the scoreboard looks proportioned on tall phones. Commentary naturally flows into the remaining ~70 % via the parent ScrollView. Fixes the "scoreboard overflow / content clipped" reports on several devices.
            - **Header logo ~18 % larger** (`src/components/Header.tsx`): `LogoFireTail size` 85 → 100, `styles.logo` 72 × 72 → 85 × 85, header height 110 → 125. Right-side buttons (Inbox / Settings / Unlock) still fit comfortably on phones as narrow as 360 dp — no overlap.
            - **LogoFireTail** rewritten: the orbiting fireball + dot-tail has been replaced with a **continuous rainbow pixel line** (55 tiny 2–5 px pixels staggered on one shared 30-second loop) whose length ≈ logo width and which kisses the logo border. The leading tip still emits 24 tiny sparks that burst out + fade, and 7 rainbow ember drops fall with gravity from the bottom edge — the "fire-pixel angare" the user asked for. Wicket-mode red burst still works.

            ### Files changed
            - `frontend/plugins/withUnityAdsMediation.js` (restored)
            - `frontend/app.json` (plugin re-registered, ProGuard rules restored, rewarded ID corrected, version 1.0.9, versionCode 9)
            - `frontend/app/match/[id].tsx` (rewarded fix + scoreboard 30 % cap)
            - `frontend/app/index.tsx` (watch-ad button honors ad result, 10-fail threshold)
            - `frontend/src/context/AdMobContext.native.tsx` (rewarded unit ID corrected)
            - `frontend/src/components/Header.tsx` (logo ~18 % larger, header height 125)
            - `frontend/src/components/LogoFireTail.tsx` (rewritten → rainbow pixel line)
            - `.github/workflows/build-android.yml`
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
