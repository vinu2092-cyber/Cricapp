name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        # Use --no-lockfile to tolerate Emergent's Save-to-GitHub stripping yarn.lock.
        # yarn will resolve from package.json and produce a fresh lockfile in the CI workspace.
        run: |
          if [ -f yarn.lock ]; then
            echo "yarn.lock present — running full install"
            yarn install --network-timeout 600000
          else
            echo "yarn.lock absent — resolving from package.json directly"
            yarn install --no-lockfile --network-timeout 600000
          fi

      - name: Expo Prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Restore Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          python3 -c "
          import base64, os, sys
          b64 = os.environ['KEYSTORE_B64'].strip()
          data = base64.b64decode(b64)
          with open('frontend/android/app/release-keystore.jks', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          if data[0] == 0x30:
              print('Format: PKCS12 (OK)')
          elif data[:4].hex() == 'feedfeed':
              print('Format: JKS (OK)')
          else:
              print(f'WARNING: unknown format {data[:4].hex()}')
              sys.exit(1)
          "

      - name: Configure Release Signing
        run: python3 scripts/patch-signing.py

      - name: Ensure google-services.json
        run: ls -la frontend/android/app/google-services.json

      - name: Fix Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Build Release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricApp-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: CricApp v1.0.8
          body: |
            ## CricApp v1.0.8 — Phase 4 (Full Squads + Smart Ad Unlock)
            ### 🎯 Squads — Substitutes & Bench now visible
            - Added `fetchTeamSquad(matchId, teamId)` → calls Cricbuzz `/mcenter/v1/{id}/team/{teamId}` (the same endpoint Cricbuzz's own app uses for its Squads tab).
            - SquadsSection now fetches BOTH teams' full squads in parallel after match info loads. Renders Playing XI + Substitutes + Bench with `faceImageId` photos end-to-end.
            - ScorecardSection + match-page commentary photo map also pull from the same endpoint, so batter/bowler avatars and event-card photos render reliably (incoming substitutes too).
            - `deepExtractPlayers` extended to recognise additional key names (`Reserves`, `support staff`, `12th man`) and now treats Cricbuzz's `id` as the `faceImageId` fallback.
            ### 🎯 Smart Ad Unlock (the real fix)
            Old behaviour:    every tap counted, even if no ad shown → user got "free Pro" after 2 quick taps without seeing ads.
            New behaviour:
            - Tap 1: ad shown → `1/2` watched; if it FAILED → `Ad not available` toast, internal fail counter +1.
            - Tap 2: ad shown → `2/2` → Pro unlocked normally.
            - If ad fails 2 consecutive times → `Free Pro Unlocked!` (so the user is never stuck behind Google's ad inventory).
            - Loading spinner + disabled state during ad request preserved.
            ### Phase 3 (Commentary Gap Fix) — still in effect
            - tms+iid pagination, walks back through innings until ball 0.1.
            ### Phase 2 (UI + Ads) — still in effect
            - Rewarded ad unit ID corrected to /6702740458, blocking alerts removed, ADS_REQUIRED 3 → 2.
            - 100% width event cards, marginVertical: 12, 13–14px fonts.
            - Team logos in match list + header.
            - Scorecard avatars 24 → 32px.
            ### Phase 1 (Build Fix) — still in effect
            - compileSdk/targetSdk 35 → 36.
          files: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
