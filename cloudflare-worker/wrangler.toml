# CricApp Cloudflare Worker — Edge Cache + RapidAPI Proxy
# PRODUCTION READY v1.0.19

name = "cricapp-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "29163b66329a4990cfe33e9a4d887f74"

[vars]
# 25-second cache for ALL endpoints
CACHE_TTL = "25"

# Cloud Firestore REST API URL
FIRESTORE_URL = "https://firestore.googleapis.com/v1/projects/cricapp-2092/databases/(default)/documents/app_config/settings"

# Secret for secure access verification
FIREBASE_SECRET = "MeraCricAppSecret_786"

# App version control
LATEST_VERSION = "1.0.19"
MIN_SUPPORTED_VERSION = "1.0.19"
PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.cricapp.live"

# CORS
ALLOWED_ORIGIN = "*"

# Rate limit (per IP, per minute)
RATE_LIMIT_PER_MIN = "120"
