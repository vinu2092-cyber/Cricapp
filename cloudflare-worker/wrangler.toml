# CricApp Cloudflare Worker — Edge Cache + RapidAPI Proxy
# 
# FEATURES:
# - 25-second cache for ALL endpoints
# - Reads API keys from Firebase dynamically (update keys without redeploy!)
# - 50,000 users → Cloudflare → Only 2-3 API calls/minute to RapidAPI
#
# Deploy:
#   npm install -g wrangler
#   wrangler login
#   wrangler deploy

name = "cricapp-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "29163b66329a4990cfe33e9a4d887f74"

[vars]
# Single 25-second cache TTL for all endpoints
CACHE_TTL = "25"

# Firebase RTDB config - Worker reads API keys from here
# UPDATE THIS: Replace with your actual Firebase project URL and path
FIREBASE_DB_URL = "https://YOUR_PROJECT_ID.firebaseio.com"
FIREBASE_KEYS_PATH = "/app_config/api_keys"

# App version control
LATEST_VERSION = "1.0.19"
MIN_SUPPORTED_VERSION = "1.0.19"
PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.cricapp.live"

# CORS
ALLOWED_ORIGIN = "*"

# RapidAPI hosts
HOST_1 = "cricbuzz-cricket.p.rapidapi.com"
HOST_2 = "cricbuzz-cricket2.p.rapidapi.com"

# Rate limit (per IP, per minute)
RATE_LIMIT_PER_MIN = "120"
