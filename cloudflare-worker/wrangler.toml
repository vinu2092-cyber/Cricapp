# CricApp Cloudflare Worker — Edge Cache + RapidAPI Proxy
#
# Deploy steps (one-time):
#   1. npm install -g wrangler
#   2. wrangler login        # browser OAuth
#   3. From this folder:
#        wrangler secret put CRICBUZZ_KEYS_HOST1
#        wrangler secret put CRICBUZZ_KEYS_HOST2
#      (paste comma-separated RapidAPI keys when prompted)
#   4. wrangler deploy
#
# Update steps (key rotation / version bump):
#   - Re-run `wrangler secret put ...` to rotate keys
#   - Edit vars below to change cache TTLs or latest version
#   - `wrangler deploy`

name = "cricapp-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers free plan: 100,000 requests/day, unlimited bandwidth
# Edge cache hits do NOT count against this limit (served from CDN)

[vars]
CACHE_TTL_LIVE = "45"          # seconds — live match list (refreshes fast)
CACHE_TTL_RECENT = "180"       # 3 min — recent matches change slowly
CACHE_TTL_UPCOMING = "600"     # 10 min — upcoming matches rarely change
CACHE_TTL_DETAIL = "20"        # 20s — match detail (live score)
CACHE_TTL_COMM = "10"          # 10s — commentary (ball-by-ball)
CACHE_TTL_SCARD = "25"         # 25s — scorecard
CACHE_TTL_TEAM = "3600"        # 1 hour — team squads rarely change

# App version control (Firestore is the primary source, this is a fallback)
LATEST_VERSION = "1.0.18"
MIN_SUPPORTED_VERSION = "1.0.18"
PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.cricapp.live"

# Allowed origin (set to '*' for now; tighten later if needed)
ALLOWED_ORIGIN = "*"

# RapidAPI hosts
HOST_1 = "cricbuzz-cricket.p.rapidapi.com"
HOST_2 = "cricbuzz-cricket2.p.rapidapi.com"

# Rate limit (per IP, per minute) — prevents abuse
RATE_LIMIT_PER_MIN = "120"
